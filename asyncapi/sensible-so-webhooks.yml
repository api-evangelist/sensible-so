- provide-a-download-url-for-a-pdf-portfolio
- generate-an-upload-url-with-config
- generate-an-upload-url-for-a-pdf-portfolio
- classify-document
alternative: Poll GET /documents/{id} (operationId retrieving-results) for the same status transitions.
