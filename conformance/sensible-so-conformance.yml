domain_standard:
  declared: false
  market: Intelligent document processing / document data extraction
  assessment: Checked the contract itself for a domain-standard signature and found none. The output shape
    is SenseML - Sensible's own configuration and output language, published as JSON Schema at https://schema.sensible.so/configuration.schema.json
    - so extracted fields are keyed on ids the customer chooses, not on any cross-vendor vocabulary. Specifically
    checked and absent - no FHIR resource for the healthcare document types (EOB, CMS1500, SBC), no X12
    or HL7v2 message type, no ACORD form identifier for the insurance document types (ACORD COIs, loss
    runs, dec pages), no MISMO container for the mortgage and closing document types, and no ISO 20022
    message for the bank-statement types. None appears in any of the 32 operations, in any of the 100+
    component schemas, or in the 208-entry documentation index.
  reward_only_note: IDP has no single settled interchange standard, so this is recorded as a finding rather
    than a penalty. It is still the integration cost a buyer inherits - a customer extracting a CMS1500
    gets a JSON object shaped by their own config, and must map it to FHIR or X12 themselves.
  candidates_probed:
