tools:
- name: list-endpoints
  title: List API Endpoints
  description: Lists all API paths and their HTTP methods with summaries, organized by path.
    Results can be passed directly into 'get-endpoint'.
  input_schema: {title: string (required)}
  read_only: true
- name: get-endpoint
  title: Get Endpoint Details
  description: Gets detailed information about a specific API endpoint, including security schemes
    and servers.
  input_schema: {path: string (required), method: string (required), title: string (required)}
  read_only: true
- name: search-endpoints
  title: Search API Endpoints
  description: Performs a deep search through paths, operations, and parameters to discover
    relevant API endpoints.
  input_schema: {pattern: string (required)}
  read_only: true
- name: list-specs
  title: List OpenAPI Specs
  description: Lists all available OpenAPI specs. Use the title to select a spec.
  input_schema: {}
  read_only: true
- name: execute-request
  title: Execute API Request
  description: Executes an API request with a given HAR request object.
  input_schema: {harRequest: object (required), title: string (required)}
  read_only: false
  destructive: true
  open_world: true
- name: search
  title: Search Documentation
  description: Searches through documentation with the given search query, returning a list of
    results with ID, title, and URL.
  input_schema: {query: string (required)}
  read_only: true
- name: fetch
  title: Fetch Documentation Page
  description: Gets detailed content for documentation by ID returned from the `search` tool.
  input_schema: {id: string (required)}
  read_only: true
authorship: platform
authorship_note: 'PLATFORM-AUTHORED: this is the ReadMe documentation-platform MCP server shape
  (list-endpoints / get-endpoint / search-endpoints / list-specs / execute-request / search /
  fetch), shared with other ReadMe-hosted providers in the catalog. It is a docs-and-proxy
  server, not a domain interface Sensible designed — none of the seven tools names a Sensible
  concept (extraction, document type, configuration, reference document, portfolio). Sensible
  business operations are reachable only indirectly, through execute-request against
  https://api.sensible.so/v0 with the caller''s own bearer key.'
