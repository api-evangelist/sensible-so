summary: 'Sensible ships a remote MCP server at docs.sensible.so/mcp, but it is the ReadMe documentation-platform
  server: seven generic tools for browsing the OpenAPI and the docs, plus one HAR-request proxy. No tool
  binds to a named Sensible operation, so every REST operation is rest_only and every tool is mcp_only.
  The only path from an agent to a Sensible business operation is execute-request, which can reach ALL
  32 operations but exposes none of their parameters as a tool input schema.'
